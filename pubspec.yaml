name: step_tracker
description: A modern, production-ready step tracker application with beautiful UI and real-time pedometer integration.
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^13.2.1

  # Local Storage
  hive_flutter: ^1.1.0

  # Charts
  fl_chart: ^0.68.0

  # Fonts & Icons
  google_fonts: ^6.2.1
  cupertino_icons: ^1.0.6

  # Animations
  flutter_animate: ^4.5.0
  lottie: ^3.1.0

  # Progress Indicators
  percent_indicator: ^4.2.3

  # Pedometer (step counter sensor)
  pedometer: ^4.0.0
  permission_handler: ^11.3.1

  # Notifications
  flutter_local_notifications: ^17.2.2
  timezone: ^0.9.4

  # Utilities
  intl: ^0.19.0
  shared_preferences: ^2.2.3
  equatable: ^2.0.5
  uuid: ^4.4.0
  path_provider: ^2.1.3
  firebase_core: ^4.9.0
  firebase_auth: ^6.5.1
  cloud_firestore: ^6.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.9
  riverpod_generator: ^2.4.0
  hive_generator: ^2.0.1
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/app_icon.png"
  min_sdk_android: 21


flutter:
  uses-material-design: true
  assets:
    - assets/
